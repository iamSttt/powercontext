# One-command deployment: seekdb + the app (frontend build served by the Node backend).
#   docker compose up --build -d     ->  http://localhost:3001
services:
  seekdb:
    image: oceanbase/seekdb:latest
    ports:
      - "2881:2881"
    volumes:
      # seekdb >= 1.4 stores its data under /var/lib/seekdb
      - ./data/seekdb:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2881'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ""
    depends_on:
      seekdb:
        condition: service_healthy
